<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mad-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#795BFF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
    <linearGradient id="mad-sheen" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <filter id="mad-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle depth -->
  <rect width="64" height="64" rx="16" fill="#0A0D18" stroke="#252C42" stroke-width="1.5" />

  <!-- Outer Structural Framework -->
  <path d="M 14 46 L 14 18 L 26 31 L 32 22 L 40 18 C 49 18 53 23 53 32 C 53 41 49 46 40 46 L 14 46 Z" 
        fill="url(#mad-grad)" 
        filter="url(#mad-glow)" />

  <!-- Inner Negative Space Sculpting M, A and D -->
  <!-- Left Cutout (M leg gap) -->
  <path d="M 19 41 L 19 25 L 26 33 L 19 41 Z" fill="#0A0D18" />
  
  <!-- Center Delta (A apex aperture) -->
  <polygon points="32,27 27,38 37,38" fill="#0A0D18" />
  
  <!-- Right Void (D inner counter) -->
  <path d="M 39 24 L 41 24 C 45 24 47 27 47 32 C 47 37 45 40 41 40 L 39 40 Z" fill="#0A0D18" />

  <!-- Specular Optical Reflection Line -->
  <path d="M 14 18 L 40 18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
